  # - name: flink-smoke
  #   enabled: false
  #   jarURI: local:///opt/flink/usrlib/sql-runner.jar
  #   args:
  #     - /opt/flink/usrlib/sql-scripts/smoke-datagen.sql
  #   parallelism: 1
  #   upgradeMode: stateless
