nameOverride: ""
fullnameOverride: ""

# ServiceAccount created by flink-operator chart (jobServiceAccount.name).
serviceAccountName: flink

# Flink CR flinkVersion enum: v1_19 | v1_20 | v2_0 | v2_1 | v2_2
flinkVersion: v1_20

image:
  # Build from flink-system/docker/Dockerfile and push to your registry.
  repository: dockerhub.company.com.vn/bevisdev/flink
  tag: "1.20.2-sync"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: dockerhub-regcred

# Shared Flink configuration for session / application deployments.
# docs: https://nightlies.apache.org/flink/flink-docs-release-1.20/docs/deployment/config/
flinkConfiguration:
  taskmanager.numberOfTaskSlots: "2"
  parallelism.default: "2"
  execution.checkpointing.interval: "60s"
  execution.checkpointing.min-pause: "10s"
  execution.checkpointing.mode: EXACTLY_ONCE
  state.backend.type: hashmap
  # Persist checkpoints when HA / S3 is available:
  # state.checkpoints.dir: s3://bucket/flink/checkpoints
  # state.savepoints.dir: s3://bucket/flink/savepoints
  # high-availability.type: kubernetes
  # high-availability.storageDir: s3://bucket/flink/ha
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: "9249"

jobManager:
  replicas: 1
  resources:
    requests:
      memory: "2048m"
      cpu: "1"
    limits:
      memory: "2048m"
      cpu: "1"

taskManager:
  replicas: 2
  resources:
    requests:
      memory: "4096m"
      cpu: "2"
    limits:
      memory: "4096m"
      cpu: "2"

# Optional shared podTemplate (imagePullSecrets, affinity, env, ...).
podTemplate:
  spec:
    imagePullSecrets:
      - name: dockerhub-regcred
    # affinity:
    #   podAntiAffinity:
    #     preferredDuringSchedulingIgnoredDuringExecution:
    #       - weight: 100
    #         podAffinityTerm:
    #           labelSelector:
    #             matchLabels:
    #               type: flink-native-kubernetes
    #           topologyKey: kubernetes.io/hostname

# ---------- Session cluster (multi-job realtime sync) ----------
# Keep a long-running JM/TM pool; submit FlinkSessionJob for each sync pipeline.
session:
  enabled: true
  name: flink-session
  # mode: standalone  # default native k8s
  annotations: {}
  # Override image / resources / config per session if needed:
  # image: dockerhub.company.com.vn/bevisdev/flink:1.20.2-sync
  # flinkConfiguration: {}
  # jobManager: {}
  # taskManager: {}
  # podTemplate: {}

# Session jobs submitted to the session cluster above.
# jarURI local:// paths must exist in the session image.
sessionJobs: []
  # - name: sync-customers
  #   enabled: true
  #   deploymentName: flink-session
  #   jarURI: local:///opt/flink/usrlib/sql-runner.jar
  #   args:
  #     - /opt/flink/usrlib/sql-scripts/cdc-oracle-customers-to-jdbc.sql
  #   parallelism: 2
  #   upgradeMode: last-state
  #   state: running

# ---------- Application-mode deployments (one job per cluster) ----------
# Preferred for production sync pipelines that need isolated resources.
deployments: []
