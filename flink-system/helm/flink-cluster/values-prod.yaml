# Production overrides for flink-cluster.

flinkConfiguration:
  taskmanager.numberOfTaskSlots: "4"
  parallelism.default: "4"
  execution.checkpointing.interval: "30s"
  execution.checkpointing.min-pause: "10s"
  execution.checkpointing.mode: EXACTLY_ONCE
  state.backend.type: hashmap
  # Uncomment and point to durable storage for HA / restarts:
  # state.checkpoints.dir: s3://dp-prod-flink/checkpoints
  # state.savepoints.dir: s3://dp-prod-flink/savepoints
  # high-availability.type: kubernetes
  # high-availability.storageDir: s3://dp-prod-flink/ha
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: "9249"

jobManager:
  replicas: 1
  resources:
    requests:
      memory: "4096m"
      cpu: "2"
    limits:
      memory: "4096m"
      cpu: "2"

taskManager:
  replicas: 3
  resources:
    requests:
      memory: "8192m"
      cpu: "4"
    limits:
      memory: "8192m"
      cpu: "4"

session:
  enabled: true
  name: flink-session

# Enable sync jobs after secrets + SQL ConfigMaps are ready.
deployments: []
sessionJobs: []
sqlConfigMaps: []
